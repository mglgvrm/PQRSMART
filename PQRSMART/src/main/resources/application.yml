spring:
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require
    username: ${PGUSER}
    password: ${PGPASSWORD}


    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      enabled: true
      max-file-size: 1000MB
      max-request-size: 1000MB
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: never
  ai:
    openai:
      api-key: ${GROQ_API_KEY:}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: openai/gpt-oss-120b
          temperature: 0.7

server:
  port: ${SERVER_PORT:8080}

supabase:
  bucket:
    public:
      url: "https://dckjzopndipyyyqroqgt.supabase.co/storage/v1/object/public/pqrs-files/"

brevo:
  api:
    key: ${BREVO_API_KEY:${RESEND_API_KEY:}}

groq:
  api-key: ${GROQ_API_KEY:}
